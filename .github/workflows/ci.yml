name: Bot source qualification
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
      # This CI job never starts the Telegram bot and never needs BOT_TOKEN.
      # The application runtime continues using Railway's existing persisted volume.
      - name: Install typecheck and routing-test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck bot and listener
        run: npm run typecheck
      - name: Verify group silence and all destination routing
        run: npx --no-install tsx --test src/destination-chats.test.ts
